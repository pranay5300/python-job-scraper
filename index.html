<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Aggregator</title>
</head>
<body>
    <h1>Job Aggregator</h1>
    <form id="jobForm">
        <label>Company Name:</label>
        <input type="text" id="company" placeholder="e.g., Google"><br>

        <label>Target Role:</label>
        <input type="text" id="role" placeholder="e.g., Product Manager"><br>

        <label>Preferred Location:</label>
        <input type="text" id="location" placeholder="e.g., United States"><br>

        <label>Job Type:</label>
        <select id="jobType">
            <option value="full-time">Full-Time</option>
            <option value="part-time">Part-Time</option>
            <option value="internship">Internship</option>
        </select><br>

        <label>Role Weight (%):</label>
        <input type="number" id="roleWeight" min="0" max="100" required><br>

        <label>Location Weight (%):</label>
        <input type="number" id="locationWeight" min="0" max="100" required><br>

        <label>Company Weight (%):</label>
        <input type="number" id="companyWeight" min="0" max="100" required><br>

        <button type="submit">Generate Excel</button>
    </form>

    <script>
        document.getElementById("jobForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const company = document.getElementById("company").value;
            const role = document.getElementById("role").value;
            const location = document.getElementById("location").value;
            const jobType = document.getElementById("jobType").value;
            const roleWeight = document.getElementById("roleWeight").value;
            const locationWeight = document.getElementById("locationWeight").value;
            const companyWeight = document.getElementById("companyWeight").value;

            const params = new URLSearchParams({
                company,
                role,
                location,
                jobType,
                role_weight: roleWeight,
                location_weight: locationWeight,
                company_weight: companyWeight
            });

            const backendUrl = "https://350b-20-163-40-128.ngrok-free.app";
            const downloadUrl = `${backendUrl}/download_excel?${params}`;

            window.location.href = downloadUrl;
        });
    </script>
</body>
</html>
