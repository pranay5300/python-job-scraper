<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Aggregator</title>
</head>
<body>
    <h1>Job Aggregator</h1>
    <form id="jobForm">
        <h2>Target Companies</h2>
        <label>Company 1:</label>
        <input type="text" id="company1" placeholder="e.g., Google">
        <input type="number" id="company1Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Company 2:</label>
        <input type="text" id="company2" placeholder="e.g., Amazon">
        <input type="number" id="company2Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Company 3:</label>
        <input type="text" id="company3" placeholder="e.g., Microsoft">
        <input type="number" id="company3Weight" placeholder="Weight %" min="0" max="100"><br>

        <h2>Target Roles</h2>
        <label>Role 1:</label>
        <input type="text" id="role1" placeholder="e.g., Product Manager">
        <input type="number" id="role1Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Role 2:</label>
        <input type="text" id="role2" placeholder="e.g., Marketing">
        <input type="number" id="role2Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Role 3:</label>
        <input type="text" id="role3" placeholder="e.g., Supply Chain">
        <input type="number" id="role3Weight" placeholder="Weight %" min="0" max="100"><br>

        <h2>Preferred Locations</h2>
        <label>Location 1:</label>
        <input type="text" id="location1" placeholder="e.g., California">
        <input type="number" id="location1Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Location 2:</label>
        <input type="text" id="location2" placeholder="e.g., Texas">
        <input type="number" id="location2Weight" placeholder="Weight %" min="0" max="100"><br>
        <label>Location 3:</label>
        <input type="text" id="location3" placeholder="e.g., Washington">
        <input type="number" id="location3Weight" placeholder="Weight %" min="0" max="100"><br>

        <h2>Overall Weights</h2>
        <label>Overall Company Weight (%):</label>
        <input type="number" id="overallCompanyWeight" min="0" max="100"><br>
        <label>Overall Role Weight (%):</label>
        <input type="number" id="overallRoleWeight" min="0" max="100"><br>
        <label>Overall Location Weight (%):</label>
        <input type="number" id="overallLocationWeight" min="0" max="100"><br>

        <button type="submit">Generate Excel</button>
    </form>

    <script>
        document.getElementById("jobForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const companies = [
                { company: document.getElementById("company1").value, weight: document.getElementById("company1Weight").value },
                { company: document.getElementById("company2").value, weight: document.getElementById("company2Weight").value },
                { company: document.getElementById("company3").value, weight: document.getElementById("company3Weight").value },
            ];

            const roles = [
                { role: document.getElementById("role1").value, weight: document.getElementById("role1Weight").value },
                { role: document.getElementById("role2").value, weight: document.getElementById("role2Weight").value },
                { role: document.getElementById("role3").value, weight: document.getElementById("role3Weight").value },
            ];

            const locations = [
                { location: document.getElementById("location1").value, weight: document.getElementById("location1Weight").value },
                { location: document.getElementById("location2").value, weight: document.getElementById("location2Weight").value },
                { location: document.getElementById("location3").value, weight: document.getElementById("location3Weight").value },
            ];

            const overallCompanyWeight = document.getElementById("overallCompanyWeight").value;
            const overallRoleWeight = document.getElementById("overallRoleWeight").value;
            const overallLocationWeight = document.getElementById("overallLocationWeight").value;

            const params = new URLSearchParams({
                companies: JSON.stringify(companies),
                roles: JSON.stringify(roles),
                locations: JSON.stringify(locations),
                overall_company_weight: overallCompanyWeight,
                overall_role_weight: overallRoleWeight,
                overall_location_weight: overallLocationWeight,
            });

            const backendUrl = "https://your-backend-url.com"; // Replace with your backend URL
            const downloadUrl = `${backendUrl}/download_excel?${params}`;

            window.location.href = downloadUrl;
        });
    </script>
</body>
</html>
