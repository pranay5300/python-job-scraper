<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Environment Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            font-family: monospace;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Frontend Environment Debug</h1>
        
        <div class="status info">
            <strong>Environment Test Results:</strong><br>
            Backend URL: <span id="backend-url">Checking...</span><br>
            Source: <span id="url-source">Determining...</span>
        </div>

        <button onclick="testBackendConnection()">Test Backend Connection</button>
        <button onclick="testWithoutCache()">Test (Bypass Cache)</button>
        
        <div id="test-results" class="status info">
            Click a button to test backend connectivity...
        </div>

        <div class="status info">
            <strong>Debug Info:</strong><br>
            • Current Page: <span id="current-url"></span><br>
            • User Agent: <span id="user-agent"></span><br>
            • Time: <span id="current-time"></span>
        </div>
    </div>

    <script>
        // Simulate React environment variable logic
        const backendUrl = 'https://python-job-scraper.onrender.com'; // Force production URL for testing
        const fallbackUrl = 'http://localhost:5000';
        
        // Update display
        document.getElementById('backend-url').textContent = backendUrl;
        document.getElementById('url-source').textContent = 'Hardcoded for testing (should be from .env)';
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('user-agent').textContent = navigator.userAgent.substring(0, 50) + '...';
        document.getElementById('current-time').textContent = new Date().toLocaleString();

        async function testBackendConnection() {
            const resultDiv = document.getElementById('test-results');
            
            try {
                resultDiv.className = 'status info';
                resultDiv.innerHTML = '🔄 Testing connection to: ' + backendUrl;
                
                const response = await fetch(backendUrl + '/health');
                const data = await response.json();
                
                resultDiv.className = 'status success';
                resultDiv.innerHTML = `✅ <strong>SUCCESS!</strong><br>
                    Backend URL: ${backendUrl}<br>
                    Status: ${data.status}<br>
                    Database: ${data.database_initialized ? 'Initialized' : 'Not initialized'}<br>
                    Response Time: ${Date.now() - startTime}ms<br>
                    Timestamp: ${data.timestamp}`;
                
            } catch (error) {
                resultDiv.className = 'status error';
                resultDiv.innerHTML = `❌ <strong>CONNECTION FAILED</strong><br>
                    Backend URL: ${backendUrl}<br>
                    Error: ${error.message}<br>
                    Type: ${error.name}<br>
                    This indicates CORS, network, or backend issues.`;
            }
        }

        async function testWithoutCache() {
            const resultDiv = document.getElementById('test-results');
            
            try {
                resultDiv.className = 'status info';
                resultDiv.innerHTML = '🔄 Testing with cache bypass...';
                
                const response = await fetch(backendUrl + '/health?t=' + Date.now(), {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                const data = await response.json();
                
                resultDiv.className = 'status success';
                resultDiv.innerHTML = `✅ <strong>SUCCESS (No Cache)!</strong><br>
                    Backend URL: ${backendUrl}<br>
                    Status: ${data.status}<br>
                    CORS Headers: ${response.headers.get('access-control-allow-origin') || 'Not visible'}<br>
                    Timestamp: ${data.timestamp}`;
                
            } catch (error) {
                resultDiv.className = 'status error';
                resultDiv.innerHTML = `❌ <strong>CACHE BYPASS FAILED</strong><br>
                    Error: ${error.message}<br>
                    Stack: ${error.stack ? error.stack.substring(0, 200) + '...' : 'N/A'}`;
            }
        }

        // Auto-run test on page load
        let startTime;
        window.onload = function() {
            startTime = Date.now();
            setTimeout(testBackendConnection, 1000);
        };
    </script>
</body>
</html>
